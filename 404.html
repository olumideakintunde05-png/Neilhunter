<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — NeilHunter</title>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-D89GTNK2C9"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet"/>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
  <meta name="theme-color" content="#0d1f1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0d0d0f;
      color: #f0f0f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    /* Animated background dots */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(20,184,166,.15) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .content { position: relative; z-index: 1; max-width: 420px; }

    /* Logo */
    .logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 48px; text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: #14b8a6;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-size: 18px; font-weight: 700; color: #fff; }

    /* 404 number */
    .error-num {
      font-size: 120px; font-weight: 700; line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px rgba(20,184,166,.3);
      letter-spacing: -4px;
      margin-bottom: 8px;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { -webkit-text-stroke-color: rgba(20,184,166,.3); }
      50% { -webkit-text-stroke-color: rgba(20,184,166,.7); }
    }

    /* Crosshair icon */
    .crosshair {
      width: 64px; height: 64px;
      background: rgba(20,184,166,.1);
      border: 1px solid rgba(20,184,166,.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      animation: rotate 8s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }

    h1 {
      font-size: 26px; font-weight: 700;
      letter-spacing: -.02em; margin-bottom: 12px;
    }
    h1 em {
      font-family: 'Instrument Serif', serif;
      font-style: italic; color: #14b8a6;
    }

    p {
      font-size: 15px; color: rgba(255,255,255,.5);
      line-height: 1.6; margin-bottom: 36px;
    }

    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 24px; border-radius: 12px;
      background: #14b8a6; color: #fff;
      font-weight: 600; font-size: 14px;
      text-decoration: none; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .88; }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 24px; border-radius: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.7);
      font-weight: 500; font-size: 14px;
      text-decoration: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .15s;
    }
    .btn-ghost:hover { border-color: #14b8a6; color: #14b8a6; }

    .help-text {
      margin-top: 32px; font-size: 13px;
      color: rgba(255,255,255,.25);
    }
    .help-text a { color: #14b8a6; text-decoration: none; }
    .help-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="content">

    <!-- Logo -->
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <span class="logo-text">NeilHunter</span>
    </a>

    <!-- Spinning crosshair -->
    <div class="crosshair">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#14b8a6" stroke-width="2">
        <circle cx="12" cy="12" r="7"/>
        <line x1="12" y1="2" x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/>
        <line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
    </div>

    <!-- 404 -->
    <div class="error-num">404</div>

    <h1>Lead <em>not found</em></h1>
    <p>Looks like this page doesn't exist. Maybe it moved, or you followed a broken link. Let's get you back on track.</p>

    <div class="btn-group">
      <a href="index.html" class="btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Home
      </a>
      <a href="dashboard.html" class="btn-ghost">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search Leads
      </a>
    </div>

    <p class="help-text">
      Still lost? <a href="mailto:neilhuntersupport@gmail.com">Contact support</a>
    </p>

  </div>

  <script>
    if (localStorage.getItem('nh_theme') === 'light') {
      document.body.style.background = '#f5f5f7';
      document.body.style.color = '#111113';
    }
  </script>
</body>
</html>
